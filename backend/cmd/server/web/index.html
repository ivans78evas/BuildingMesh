<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildingMesh | Engineering Console</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        :root { --bg-primary: #0a0b10; --bg-secondary: #13151c; --accent-blue: #00e5ff; --border-color: #222632; --text-main: #e2e8f0; --text-dim: #94a3b8; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); color: var(--text-main); margin: 0; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .bm-sidebar { background: var(--bg-secondary); border-right: 1px solid var(--border-color); }
        .bm-card { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 4px; overflow: hidden; }
        .bm-btn-primary { background: rgba(0, 229, 255, 0.1); color: var(--accent-blue); border: 1px solid var(--accent-blue); padding: 8px 20px; border-radius: 4px; font-weight: 600; font-size: 0.75rem; text-transform: uppercase; transition: all 0.2s; }
        .bm-btn-primary:hover { background: var(--accent-blue); color: #000; box-shadow: 0 0 15px rgba(0, 229, 255, 0.4); }
        .bm-input { background: #06070a; border: 1px solid var(--border-color); color: white; padding: 12px; border-radius: 4px; width: 100%; outline: none; }
        table thead th { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; color: var(--text-dim); padding: 12px 16px; border-bottom: 1px solid var(--border-color); }
        table tbody td { padding: 16px; border-bottom: 1px solid rgba(34, 38, 50, 0.5); font-size: 0.875rem; }
        .nav-item-active { background: rgba(0, 229, 255, 0.05); color: var(--accent-blue); border-bottom: 2px solid var(--accent-blue); }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; transition: all 0.3s ease-out; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const colors = {
                success: 'bg-green-500/20 border-green-500 text-green-400',
                error: 'bg-red-500/20 border-red-500 text-red-400',
                info: 'bg-cyan-500/20 border-cyan-500 text-cyan-400'
            };

            return (
                <div className={`fixed bottom-8 right-8 px-6 py-4 border rounded shadow-2xl z-[100] flex items-center gap-3 animate-bounce-short ${colors[type] || colors.info}`}>
                    <i className={`fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}`}></i>
                    <span className="text-xs font-bold uppercase tracking-wider">{message}</span>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [subView, setSubView] = useState('ingestion');
            const [projects, setProjects] = useState([]);
            const [selectedProject, setSelectedProject] = useState(null);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [selectedWall, setSelectedWall] = useState(null);
            const [toasts, setToasts] = useState([]);
            const [uploading, setUploading] = useState(false);

            const fileInputRef = useRef(null);
            const planInputRef = useRef(null);

            useEffect(() => { loadProjects(); }, []);

            const addToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
            };

            const removeToast = (id) => {
                setToasts(prev => prev.filter(t => t.id !== id));
            };

            const loadProjects = async () => {
                try {
                    const res = await fetch('/api/v1/projects');
                    if (!res.ok) throw new Error('API Error');
                    const data = await res.json();
                    setProjects(data || []);
                } catch (e) {
                    setProjects([{id: 'p1', name: 'ТЕСТОВЫЙ ОБЪЕКТ', address: 'УЛ. СТРОИТЕЛЕЙ, 1', created_at: new Date()}]);
                    addToast("Loaded from local cache (API Unavailable)", "info");
                }
            };

            const handleCreate = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                try {
                    const res = await fetch('/api/v1/projects', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: fd.get('name'), address: fd.get('address'), organization_id: 'org-1' })
                    });
                    if (res.ok) {
                        addToast("Project initialized successfully", "success");
                        setIsModalOpen(false);
                        loadProjects();
                    } else {
                        throw new Error('Failed to create');
                    }
                } catch (e) {
                    addToast("Error communicating with backend", "error");
                }
            };

            const handleFileUpload = async (type) => {
                const input = type === 'splat' ? fileInputRef.current : planInputRef.current;
                if (!input.files[0]) return;

                setUploading(true);
                addToast(`Uploading ${input.files[0].name}...`, "info");

                const formData = new FormData();
                formData.append('file', input.files[0]);
                formData.append('name', input.files[0].name);

                const endpoint = type === 'splat'
                    ? `/api/v1/projects/${selectedProject.id}/splats`
                    : `/api/v1/projects/${selectedProject.id}/plans`;

                try {
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        body: formData
                    });
                    if (res.status === 202 || res.ok) {
                        addToast("Upload accepted. Processing in background...", "success");
                    } else {
                        addToast("Upload failed (Rate Limit or Server Error)", "error");
                    }
                } catch (e) {
                    addToast("Network error during upload", "error");
                } finally {
                    setUploading(false);
                    input.value = '';
                }
            };

            const walls = [
                { id: 'W-001', length: '4.2m', height: '3.0m', deviation: '+2mm', status: 'Verified' },
                { id: 'W-002', length: '2.5m', height: '3.0m', deviation: '-5mm', status: 'Pending' },
                { id: 'W-003', length: '5.8m', height: '3.0m', deviation: '+1mm', status: 'Verified' },
                { id: 'W-004', length: '3.1m', height: '3.0m', deviation: '+12mm', status: 'Critical' },
            ];

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-72 bm-sidebar flex flex-col p-8">
                        <div className="flex items-center gap-3 mb-12">
                            <div className="w-10 h-10 border-2 border-cyan-500 rounded-sm flex items-center justify-center transform rotate-45">
                                <i className="fas fa-layer-group text-cyan-500 transform -rotate-45 text-sm"></i>
                            </div>
                            <span className="font-bold text-lg tracking-tighter uppercase mono">Building<span className="text-cyan-500">Mesh</span></span>
                        </div>
                        <nav className="space-y-1">
                            <button
                                onClick={() => setView('dashboard')}
                                className={`w-full flex items-center gap-4 px-4 py-3 rounded transition text-sm font-semibold text-left ${view === 'dashboard' ? 'bg-cyan-500/5 text-cyan-400 border-l-2 border-cyan-500' : 'text-slate-400 hover:text-white'}`}
                            >
                                <i className="fas fa-th-large w-5"></i>
                                Project Registry
                            </button>
                            <button
                                onClick={() => addToast("User Management: Access Restricted", "error")}
                                className="w-full flex items-center gap-4 px-4 py-3 rounded transition text-sm font-semibold text-left text-slate-400 hover:text-white"
                            >
                                <i className="fas fa-users w-5"></i>
                                Teams
                            </button>
                            <button
                                onClick={() => addToast("Settings: Backend Syncing...", "info")}
                                className="w-full flex items-center gap-4 px-4 py-3 rounded transition text-sm font-semibold text-left text-slate-400 hover:text-white"
                            >
                                <i className="fas fa-cog w-5"></i>
                                Global Config
                            </button>
                        </nav>
                        <div className="mt-auto pt-8 border-t border-slate-800/50">
                            <div className="flex items-center gap-3 px-4">
                                <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-[10px] font-bold">JD</div>
                                <div>
                                    <div className="text-[10px] font-bold uppercase text-white">Chief Engineer</div>
                                    <div className="text-[9px] text-slate-500 mono">ID: 0x48FA2</div>
                                </div>
                            </div>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 overflow-auto bg-[#0a0b10]">
                        {view === 'dashboard' ? (
                            <div className="p-12 max-w-7xl mx-auto">
                                <div className="flex justify-between items-end mb-12">
                                    <div>
                                        <div className="text-cyan-500 text-[10px] font-black uppercase tracking-[0.2em] mb-2">Centralized Management</div>
                                        <h1 className="text-4xl font-bold uppercase mono">Projects Registry</h1>
                                    </div>
                                    <button onClick={() => setIsModalOpen(true)} className="bm-btn-primary">Initialize New Object</button>
                                </div>
                                <div className="bm-card">
                                    <table className="w-full text-left">
                                        <thead>
                                            <tr>
                                                <th className="cursor-pointer hover:text-cyan-400" onClick={() => addToast("Sorting by ID...", "info")}>ID <i className="fas fa-sort-down ml-1 opacity-40"></i></th>
                                                <th className="cursor-pointer hover:text-cyan-400" onClick={() => addToast("Sorting by Name...", "info")}>Project Name</th>
                                                <th>Location</th>
                                                <th>Deployment</th>
                                                <th className="text-right">Action</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {projects.map(p => (
                                                <tr key={p.id} className="hover:bg-white/[0.02] transition">
                                                    <td className="mono text-xs text-cyan-500/60 uppercase">{p.id.substring(0, 5)}</td>
                                                    <td className="font-bold">{p.name}</td>
                                                    <td className="text-slate-500">{p.address || 'UNDEFINED'}</td>
                                                    <td className="text-slate-600 mono text-xs">{new Date(p.created_at).toISOString().split('T')[0]}</td>
                                                    <td className="text-right">
                                                        <button
                                                            onClick={() => { setSelectedProject(p); setView('details'); }}
                                                            className="text-xs font-bold uppercase text-cyan-500 border border-cyan-500/30 px-3 py-1 hover:bg-cyan-500 hover:text-black transition"
                                                        >
                                                            Access Console
                                                        </button>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        ) : (
                            <div className="flex flex-col h-full">
                                {/* Project Header & Sub-nav */}
                                <div className="bg-[#13151c] border-b border-[#222632] px-12 pt-10">
                                    <div className="flex justify-between items-start mb-8">
                                        <div>
                                            <button onClick={() => setView('dashboard')} className="mb-4 text-[10px] font-bold uppercase tracking-widest text-slate-500 hover:text-white flex items-center gap-2">
                                                <i className="fas fa-arrow-left"></i> ← BACK
                                            </button>
                                            <h2 className="text-5xl font-black uppercase italic leading-none">{selectedProject.name}</h2>
                                            <div className="flex items-center gap-4 mt-2 text-[10px] mono text-slate-500 uppercase">
                                                <span><i className="fas fa-map-marker-alt mr-1"></i> {selectedProject.address}</span>
                                                <span className="text-cyan-500/40">|</span>
                                                <span><i className="fas fa-fingerprint mr-1"></i> UUID: {selectedProject.id}</span>
                                            </div>
                                        </div>
                                        <div className="flex gap-2">
                                            <button onClick={() => addToast("Generating PDF Report...", "info")} className="px-4 py-2 bg-slate-800 text-[10px] font-bold uppercase rounded hover:bg-slate-700 transition">Export Report</button>
                                            <button onClick={() => addToast("Initializing AR Core Engine...", "info")} className="px-4 py-2 bg-cyan-500 text-black text-[10px] font-bold uppercase rounded hover:bg-cyan-400 transition">Go Live AR</button>
                                        </div>
                                    </div>

                                    {/* Sub-menu Pipeline */}
                                    <div className="flex gap-8">
                                        {[
                                            {id: 'ingestion', label: 'Data Ingestion', icon: 'fa-file-import'},
                                            {id: 'alignment', label: 'Spatial Alignment', icon: 'fa-draw-polygon'},
                                            {id: 'analytics', label: 'Wall Analytics & Inspection', icon: 'fa-chart-network'},
                                            {id: 'sync', label: 'AR Field Sync', icon: 'fa-sync-alt'}
                                        ].map(tab => (
                                            <button
                                                key={tab.id}
                                                onClick={() => setSubView(tab.id)}
                                                className={`pb-4 px-2 text-[11px] font-bold uppercase tracking-wider flex items-center gap-2 transition ${subView === tab.id ? 'text-cyan-400 border-b-2 border-cyan-400' : 'text-slate-500 hover:text-slate-300 border-b-2 border-transparent'}`}
                                            >
                                                <i className={`fas ${tab.icon}`}></i> {tab.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Tab Content */}
                                <div className="flex-1 p-12 overflow-auto">
                                    {subView === 'ingestion' && (
                                        <div className="grid grid-cols-2 gap-10 max-w-6xl">
                                            <div className="bm-card p-10 flex flex-col">
                                                <div className="flex justify-between items-start mb-8">
                                                    <h3 className="font-bold text-sm uppercase text-cyan-500">Spatial Data Scan (.PLY)</h3>
                                                    <i className="fas fa-cloud-upload-alt text-slate-700 text-2xl"></i>
                                                </div>
                                                <div className="flex-1 border border-dashed border-slate-800 p-12 flex flex-col items-center justify-center text-slate-600">
                                                    <i className="fas fa-cube text-4xl mb-4 opacity-20"></i>
                                                    <span className="uppercase text-[10px] font-bold tracking-widest">Drop Gaussian Splat or PLY here</span>
                                                </div>
                                                <input type="file" ref={fileInputRef} className="hidden" onChange={() => handleFileUpload('splat')} accept=".ply" />
                                                <button onClick={() => fileInputRef.current.click()} disabled={uploading} className="bm-btn-primary w-full mt-8">
                                                    {uploading ? 'Processing...' : 'Upload PLY'}
                                                </button>
                                            </div>
                                            <div className="bm-card p-10 flex flex-col">
                                                <div className="flex justify-between items-start mb-8">
                                                    <h3 className="font-bold text-sm uppercase text-cyan-500">Architectural Plan</h3>
                                                    <i className="fas fa-map text-slate-700 text-2xl"></i>
                                                </div>
                                                <div className="flex-1 border border-dashed border-slate-800 p-12 flex flex-col items-center justify-center text-slate-600">
                                                    <i className="fas fa-file-pdf text-4xl mb-4 opacity-20"></i>
                                                    <span className="uppercase text-[10px] font-bold tracking-widest">Select PNG/PDF Drawing</span>
                                                </div>
                                                <input type="file" ref={planInputRef} className="hidden" onChange={() => handleFileUpload('plan')} accept=".png,.pdf" />
                                                <button onClick={() => planInputRef.current.click()} disabled={uploading} className="bm-btn-primary w-full mt-8">
                                                    {uploading ? 'Processing...' : 'Upload Plan'}
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    {subView === 'alignment' && (
                                        <div className="h-full bm-card relative flex items-center justify-center bg-[#06070a]">
                                            <div className="absolute top-8 left-8">
                                                <h3 className="font-bold text-sm uppercase text-cyan-500 mb-2">2D to 3D Registration</h3>
                                                <p className="text-[10px] text-slate-500 uppercase font-bold">Align anchor points for AR projection</p>
                                            </div>
                                            <div className="text-center">
                                                <div className="inline-block w-24 h-24 border-2 border-cyan-500/20 rounded-full border-t-cyan-500 animate-spin mb-6"></div>
                                                <div className="mono text-[10px] text-cyan-500 animate-pulse uppercase tracking-[0.3em]">Waiting for data sources...</div>
                                            </div>
                                            <div className="absolute bottom-8 right-8 flex gap-4">
                                                <button onClick={() => addToast("Alignment reset", "info")} className="px-4 py-2 bg-slate-800 text-[10px] font-bold uppercase">Reset Alignment</button>
                                                <button onClick={() => addToast("Transformation matrix saved to DB", "success")} className="px-4 py-2 bg-cyan-500 text-black text-[10px] font-bold uppercase">Save Transformation</button>
                                            </div>
                                        </div>
                                    )}

                                    {subView === 'analytics' && (
                                        <div className="flex gap-10 h-full">
                                            <div className="w-1/3 bm-card flex flex-col">
                                                <div className="p-6 border-b border-slate-800 bg-white/[0.02] flex justify-between items-center">
                                                    <h3 className="font-bold text-xs uppercase tracking-widest">Detected Walls</h3>
                                                    <button onClick={() => addToast("Re-scanning 3D Cloud...", "info")} className="text-[10px] text-cyan-500 uppercase font-bold"><i className="fas fa-sync mr-1"></i> Refresh</button>
                                                </div>
                                                <div className="flex-1 overflow-auto">
                                                    {walls.map(wall => (
                                                        <div
                                                            key={wall.id}
                                                            onClick={() => setSelectedWall(wall)}
                                                            className={`p-6 border-b border-slate-800/50 cursor-pointer transition flex justify-between items-center ${selectedWall?.id === wall.id ? 'bg-cyan-500/10 border-r-2 border-r-cyan-500' : 'hover:bg-white/[0.02]'}`}
                                                        >
                                                            <div>
                                                                <div className="mono text-xs font-bold">{wall.id}</div>
                                                                <div className="text-[10px] text-slate-500 mt-1">STRUCTURAL_SEGMENT</div>
                                                            </div>
                                                            <div className={`text-[9px] px-2 py-0.5 rounded font-bold uppercase ${wall.status === 'Verified' ? 'bg-green-500/20 text-green-400' : wall.status === 'Critical' ? 'bg-red-500/20 text-red-400' : 'bg-yellow-500/20 text-yellow-400'}`}>
                                                                {wall.status}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="flex-1">
                                                {selectedWall ? (
                                                    <div className="bm-card h-full p-10 flex flex-col">
                                                        <div className="flex justify-between items-center mb-12">
                                                            <h3 className="text-3xl font-black uppercase italic tracking-tighter">Wall Parameters: {selectedWall.id}</h3>
                                                            <button onClick={() => addToast(`Opening photofix for ${selectedWall.id}`, "info")} className="text-[10px] font-bold uppercase text-cyan-400 border border-cyan-400/30 px-4 py-2 hover:bg-cyan-400/10">Inspect Scans</button>
                                                        </div>
                                                        <div className="grid grid-cols-2 gap-8 mb-12">
                                                            <div className="p-6 bg-white/[0.02] border border-slate-800">
                                                                <div className="text-[10px] text-slate-500 uppercase font-bold mb-1">Measured Length</div>
                                                                <div className="text-2xl font-bold mono">{selectedWall.length}</div>
                                                            </div>
                                                            <div className="p-6 bg-white/[0.02] border border-slate-800">
                                                                <div className="text-[10px] text-slate-500 uppercase font-bold mb-1">Measured Height</div>
                                                                <div className="text-2xl font-bold mono">{selectedWall.height}</div>
                                                            </div>
                                                            <div className="p-6 bg-white/[0.02] border border-slate-800">
                                                                <div className="text-[10px] text-slate-500 uppercase font-bold mb-1">Design Deviation</div>
                                                                <div className={`text-2xl font-bold mono ${selectedWall.deviation.includes('+12') ? 'text-red-500' : 'text-cyan-400'}`}>{selectedWall.deviation}</div>
                                                            </div>
                                                            <div className="p-6 bg-white/[0.02] border border-slate-800">
                                                                <div className="text-[10px] text-slate-500 uppercase font-bold mb-1">Integrity Score</div>
                                                                <div className="text-2xl font-bold mono">98.2%</div>
                                                            </div>
                                                        </div>
                                                        <div className="mt-auto">
                                                            <div className="flex justify-between items-center mb-4">
                                                                <h4 className="text-[10px] font-black uppercase tracking-widest text-slate-500">Inspection History</h4>
                                                                <button onClick={() => addToast("Adding Manual Entry...", "info")} className="text-[9px] font-bold uppercase text-slate-400 hover:text-white"><i className="fas fa-plus mr-1"></i> Add Entry</button>
                                                            </div>
                                                            <div className="space-y-2">
                                                                <div className="p-4 bg-white/[0.01] flex justify-between text-[11px] mono border-l-2 border-green-500">
                                                                    <span>2026-05-23 14:20</span>
                                                                    <span>SCAN_AUTO_VERIFY</span>
                                                                    <span className="text-green-400">PASSED</span>
                                                                </div>
                                                                <div className="p-4 bg-white/[0.01] flex justify-between text-[11px] mono border-l-2 border-slate-700">
                                                                    <span>2026-05-22 09:15</span>
                                                                    <span>MANUAL_INSPECTION</span>
                                                                    <span className="text-slate-500">LOGGED</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ) : (
                                                    <div className="bm-card h-full flex flex-col items-center justify-center text-slate-600 border-dashed">
                                                        <i className="fas fa-mouse-pointer text-3xl mb-4 opacity-10"></i>
                                                        <span className="uppercase text-[10px] font-bold tracking-[0.2em]">Select a segment for analysis</span>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {subView === 'sync' && (
                                        <div className="max-w-4xl">
                                            <div className="flex justify-between items-center mb-8">
                                                <h3 className="text-2xl font-bold uppercase mono">Field Devices</h3>
                                                <div className="flex items-center gap-2">
                                                    <div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                                                    <span className="text-[10px] font-bold uppercase text-slate-400">Real-time Gateway Active</span>
                                                </div>
                                            </div>
                                            <div className="space-y-4">
                                                {[
                                                    {name: 'Engineer iPhone 15 Pro', user: 'Alexey V.', status: 'Online', lastSync: '2 min ago'},
                                                    {name: 'Site iPad Pro #4', user: 'Dmitry K.', status: 'Syncing', lastSync: 'Just now'},
                                                    {name: 'Foreman Android Rugged', user: 'Igor S.', status: 'Offline', lastSync: '3 hours ago'}
                                                ].map(dev => (
                                                    <div key={dev.name} className="bm-card p-6 flex justify-between items-center">
                                                        <div className="flex items-center gap-6">
                                                            <div className="w-12 h-12 bg-white/[0.05] rounded flex items-center justify-center">
                                                                <i className={`fas ${dev.name.includes('iPhone') ? 'fa-mobile-alt' : dev.name.includes('iPad') ? 'fa-tablet-alt' : 'fa-robot'} text-xl text-slate-500`}></i>
                                                            </div>
                                                            <div>
                                                                <div className="font-bold text-sm">{dev.name}</div>
                                                                <div className="text-[10px] text-slate-500 uppercase font-bold">{dev.user}</div>
                                                            </div>
                                                        </div>
                                                        <div className="text-right">
                                                            <div className={`text-[10px] font-bold uppercase ${dev.status === 'Online' ? 'text-green-400' : dev.status === 'Syncing' ? 'text-cyan-400' : 'text-slate-600'}`}>{dev.status}</div>
                                                            <div className="text-[10px] mono text-slate-700 mt-1">Last seen: {dev.lastSync}</div>
                                                            <button onClick={() => addToast(`Force Syncing ${dev.name}...`, "info")} className="mt-3 block w-full text-[9px] font-bold uppercase bg-white/5 py-1 rounded hover:bg-white/10">Force Push</button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                            <div className="mt-12 p-8 border border-cyan-500/20 bg-cyan-500/5 rounded">
                                                <div className="flex gap-6 items-center">
                                                    <i className="fas fa-info-circle text-cyan-500 text-2xl"></i>
                                                    <div>
                                                        <h4 className="text-xs font-bold uppercase text-cyan-500 mb-1">Global Change Propagation</h4>
                                                        <p className="text-[11px] text-slate-400">All structural updates made in this console are automatically pushed to field devices within 500ms when they are online.</p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Modals */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
                            <div className="bm-card w-full max-w-xl p-12 border-cyan-500/30">
                                <h2 className="text-3xl font-black uppercase italic mb-8">Initialize Object</h2>
                                <form onSubmit={handleCreate} className="space-y-8">
                                    <div>
                                        <label className="block text-[10px] font-bold uppercase text-slate-500 mb-2">Project Label</label>
                                        <input name="name" required className="bm-input focus:border-cyan-500 transition-colors" placeholder="e.g. SKYLINE_TOWER_NORTH" />
                                    </div>
                                    <div>
                                        <label className="block text-[10px] font-bold uppercase text-slate-500 mb-2">Geo-Location / Address</label>
                                        <input name="address" required className="bm-input focus:border-cyan-500 transition-colors" placeholder="Latitude, Longitude or Physical Address" />
                                    </div>
                                    <div className="flex gap-4 pt-4">
                                        <button type="button" onClick={() => setIsModalOpen(false)} className="flex-1 text-slate-500 uppercase font-bold text-xs hover:text-white transition">Abort Operation</button>
                                        <button type="submit" className="flex-1 bm-btn-primary">Finalize Deployment</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Toasts */}
                    <div className="pointer-events-none fixed inset-0 z-[100] flex flex-col items-end justify-end p-8 gap-4">
                        {toasts.map(toast => (
                            <Toast key={toast.id} {...toast} onClose={() => removeToast(toast.id)} />
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
