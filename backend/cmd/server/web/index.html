<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuildingMesh | Enterprise Deep Control</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        :root { --primary: #2563eb; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #020617; color: #f8fafc; margin: 0; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .bg-tenant { background-color: var(--primary); }
        .text-tenant { color: var(--primary); }
        .border-tenant { border-color: var(--primary); }
        .accent-tenant { accent-color: var(--primary); }

        input[type="range"]::-webkit-scrollbar { display: none; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }

        @keyframes scan {
            0% { top: 0%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        .scan-line {
            height: 2px;
            background: linear-gradient(to right, transparent, var(--primary), transparent);
            position: absolute;
            width: 100%;
            z-index: 20;
            animation: scan 3s linear infinite;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 3D Viewer Component ---
        const ThreeDViewer = ({ step = 3, primaryColor = '#2563eb' }) => {
            const mountRef = useRef(null);
            const rendererRef = useRef(null);
            const sceneRef = useRef(null);
            const wallRef = useRef(null);
            const pipesRef = useRef(null);

            useEffect(() => {
                const width = mountRef.current.clientWidth;
                const height = mountRef.current.clientHeight;
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

                renderer.setSize(width, height);
                mountRef.current.appendChild(renderer.domElement);
                rendererRef.current = renderer;
                sceneRef.current = scene;

                const grid = new THREE.GridHelper(20, 20, 0x1e293b, 0x0f172a);
                scene.add(grid);
                scene.add(new THREE.AmbientLight(0x404040, 2));
                const light = new THREE.DirectionalLight(0xffffff, 1);
                light.position.set(10, 10, 10);
                scene.add(light);

                const wallGeo = new THREE.BoxGeometry(4, 3, 0.3);
                const wallMat = new THREE.MeshPhongMaterial({ color: 0x888888, transparent: true, opacity: 0.8 });
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.y = 1.5;
                scene.add(wall);
                wallRef.current = wall;

                const pipeGroup = new THREE.Group();
                const pipeMat = new THREE.MeshPhongMaterial({ color: primaryColor, emissive: primaryColor, emissiveIntensity: 0.2 });
                for(let i = 0; i < 3; i++) {
                    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 3), pipeMat);
                    p.position.set(-1.2 + (i * 1.2), 1.5, 0);
                    pipeGroup.add(p);
                }
                scene.add(pipeGroup);
                pipesRef.current = pipeGroup;

                camera.position.set(4, 3, 4);
                camera.lookAt(0, 1.2, 0);

                const animate = () => {
                    requestAnimationFrame(animate);
                    scene.rotation.y += 0.001;
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => {
                    const w = mountRef.current.clientWidth;
                    const h = mountRef.current.clientHeight;
                    renderer.setSize(w, h);
                    camera.aspect = w / h;
                    camera.updateProjectionMatrix();
                };
                window.addEventListener('resize', handleResize);
                return () => {
                    window.removeEventListener('resize', handleResize);
                    mountRef.current?.removeChild(renderer.domElement);
                };
            }, []);

            useEffect(() => {
                if (!wallRef.current || !pipesRef.current) return;
                const configs = {
                    1: { color: 0x666666, opacity: 1.0, pipes: false },
                    2: { color: 0x444444, opacity: 0.3, pipes: true },
                    3: { color: 0x888888, opacity: 0.8, pipes: true }
                };
                const c = configs[step] || configs[3];
                wallRef.current.material.color.setHex(c.color);
                wallRef.current.material.opacity = c.opacity;
                pipesRef.current.visible = c.pipes;
            }, [step]);

            return <div ref={mountRef} className="w-full h-full" />;
        };

        // --- Auth Provider (Simplified) ---
        const App = () => {
            const [user, setUser] = useState(JSON.parse(localStorage.getItem('user')));
            const [token, setToken] = useState(localStorage.getItem('token'));
            const [org, setOrg] = useState(null);
            const [view, setView] = useState('engineering');
            const [step, setStep] = useState(3);
            const [isScanning, setIsScanning] = useState(false);

            useEffect(() => {
                if (token) fetchOrg();
            }, [token]);

            const fetchOrg = async () => {
                try {
                    const res = await fetch('/api/v1/organizations', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (data && data.length > 0) {
                        setOrg(data[0]);
                        document.documentElement.style.setProperty('--primary', data[0].primary_color || '#2563eb');
                    }
                } catch (e) { console.error(e); }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                const email = e.target.email.value;
                const res = await fetch('/api/v1/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password: 'password' })
                });
                const data = await res.json();
                if (data.token) {
                    setToken(data.token);
                    setUser(data.user);
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                }
            };

            const logout = () => {
                setToken(null); setUser(null);
                localStorage.clear();
            };

            if (!token) {
                return (
                    <div className="h-screen w-full flex items-center justify-center bg-slate-950">
                        <div className="glass p-12 rounded-2xl w-full max-w-md shadow-2xl border-slate-800">
                            <div className="text-center mb-10">
                                <div className="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-3xl font-black mb-4 shadow-lg shadow-blue-500/20">BM</div>
                                <h1 className="text-2xl font-black tracking-tight">BuildingMesh Enterprise</h1>
                                <p className="text-slate-500 text-sm mt-2">Sign in to Deep Control Platform</p>
                            </div>
                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-2 tracking-widest">Email Address</label>
                                    <input name="email" type="email" required className="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 outline-none transition-colors" placeholder="engineer@company.com" />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-bold uppercase text-slate-500 mb-2 tracking-widest">Password</label>
                                    <input name="password" type="password" required className="w-full bg-slate-900 border border-slate-800 rounded-lg p-3 text-sm focus:border-blue-500 outline-none transition-colors" placeholder="••••••••" />
                                </div>
                                <button type="submit" className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition-all shadow-lg shadow-blue-600/20 active:scale-[0.98]">
                                    Initialize Console
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-64 border-r border-slate-800 bg-slate-950 p-6 flex flex-col justify-between">
                        <div>
                            <div className="flex items-center gap-3 mb-10">
                                <div className="w-8 h-8 bg-tenant rounded flex items-center justify-center font-black text-sm">BM</div>
                                <span className="font-bold tracking-tighter uppercase text-sm mono">BuildingMesh</span>
                            </div>

                            <nav className="space-y-1">
                                <button onClick={() => setView('engineering')} className={`w-full flex items-center gap-3 p-2.5 rounded-lg text-xs font-bold transition-all ${view === 'engineering' ? 'bg-tenant/10 text-tenant' : 'text-slate-500 hover:bg-slate-900'}`}>
                                    <i className="fas fa-cube"></i> Engineering Console
                                </button>
                                {user.role === 'Admin' && (
                                    <button onClick={() => setView('admin')} className={`w-full flex items-center gap-3 p-2.5 rounded-lg text-xs font-bold transition-all ${view === 'admin' ? 'bg-purple-500/10 text-purple-400' : 'text-slate-500 hover:bg-slate-900'}`}>
                                        <i className="fas fa-shield-alt"></i> SaaS Admin
                                    </button>
                                )}
                            </nav>
                        </div>

                        <div className="pt-6 border-t border-slate-800">
                            <div className="flex items-center gap-3 mb-4">
                                <div className="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-[10px] font-bold">{user.email[0].toUpperCase()}</div>
                                <div className="overflow-hidden">
                                    <p className="text-[10px] font-bold text-white truncate">{user.email}</p>
                                    <p className="text-[9px] text-slate-500 uppercase font-bold">{user.role}</p>
                                </div>
                            </div>
                            <button onClick={logout} className="w-full py-2 bg-slate-900 hover:bg-red-500/10 hover:text-red-400 rounded text-[10px] font-bold uppercase transition-colors">Sign Out</button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col bg-slate-950">
                        {view === 'engineering' ? (
                            <>
                                <header className="h-[73px] border-b border-slate-800 flex justify-between items-center px-8 bg-slate-950/50">
                                    <div>
                                        <h2 className="text-sm font-bold text-slate-400 uppercase tracking-widest">Active Object</h2>
                                        <p className="text-lg font-black tracking-tight">{org?.name || 'Loading...'} | Sector B2</p>
                                    </div>
                                    <div className="flex gap-4 items-center">
                                        <div className="flex items-center gap-4 bg-slate-900 px-4 py-2 rounded-full border border-slate-800">
                                            <span className="text-[10px] font-black text-slate-500 uppercase">Time-Machine</span>
                                            <input type="range" min="1" max="3" value={step} onChange={(e) => setStep(parseInt(e.target.value))} className="w-32 accent-tenant" />
                                            <span className="text-xs font-mono text-tenant font-bold">STEP_0{step}</span>
                                        </div>
                                        <button onClick={() => { setIsScanning(true); setTimeout(() => setIsScanning(false), 3000); }} className="px-6 py-2 bg-tenant text-white text-[10px] font-black uppercase rounded-lg shadow-lg shadow-tenant/20 hover:opacity-90 active:scale-95 transition-all">Compare Reality</button>
                                    </div>
                                </header>

                                <section className="flex-1 relative bg-black">
                                    {isScanning && <div className="scan-line" />}
                                    <ThreeDViewer step={step} primaryColor={org?.primary_color} />

                                    <div className="absolute top-6 right-6 space-y-4 w-72 pointer-events-none">
                                        <div className="glass p-5 rounded-2xl shadow-2xl">
                                            <p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-3">Integrity Score</p>
                                            <div className="flex justify-between items-end mb-2">
                                                <span className="text-xs font-bold">AI Verification</span>
                                                <span className="text-xl font-black text-green-400 mono">98.2%</span>
                                            </div>
                                            <div className="w-full bg-slate-800 h-2 rounded-full overflow-hidden">
                                                <div className="bg-green-500 h-full transition-all duration-1000" style={{ width: '98.2%' }}></div>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </>
                        ) : (
                            <div className="p-12">
                                <h1 className="text-4xl font-black uppercase italic mb-10">SaaS Administration</h1>
                                <div className="grid grid-cols-3 gap-8">
                                    <div className="glass p-8 rounded-2xl">
                                        <p className="text-[10px] font-bold text-slate-500 uppercase mb-2">Active Tenants</p>
                                        <p className="text-4xl font-black mono text-blue-400">14</p>
                                    </div>
                                    <div className="glass p-8 rounded-2xl">
                                        <p className="text-[10px] font-bold text-slate-500 uppercase mb-2">Fleet Hubs</p>
                                        <p className="text-4xl font-black mono text-cyan-400">42</p>
                                    </div>
                                    <div className="glass p-8 rounded-2xl">
                                        <p className="text-[10px] font-bold text-slate-500 uppercase mb-2">System Health</p>
                                        <p className="text-4xl font-black mono text-green-500">NOMINAL</p>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
